name: Windows build

# Builds friday.exe and the installer on a real Windows runner.
#
# - Push a tag like v1.1.0  -> installer attached to a GitHub Release
# - Run manually            -> installer available as a downloadable artifact
#
# This exists so an installer can be produced without owning a Windows build
# machine: trigger the workflow, then download the result.
#
# Design rule learned the hard way: a green check must mean "the installer
# exists". Every step that produces an artifact therefore verifies its own
# output and fails loudly, and nothing that matters is behind a conditional.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Also compile the Inno Setup installer"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          # Prebuilt VAD wheels so the runner needs no C++ toolchain.
          python -m pip install webrtcvad-wheels

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/friday.spec --noconfirm --clean

      - name: Verify the exe starts
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\Friday\friday.exe')) {
            throw 'PyInstaller reported success but dist\Friday\friday.exe is missing.'
          }
          .\dist\Friday\friday.exe --version
          if ($LASTEXITCODE -ne 0) { throw "friday.exe --version exited $LASTEXITCODE" }
          .\dist\Friday\friday.exe --languages
          if ($LASTEXITCODE -ne 0) { throw "friday.exe --languages exited $LASTEXITCODE" }

      - name: Report build size
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-ChildItem dist\Friday -Recurse |
            Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "dist/Friday is $mb MB"
          "Frozen app size: **$mb MB**" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Installing and compiling are unconditional. The previous version gated
      # both on `inputs.make_installer`, which is empty for a tag push and can
      # be skipped on a manual run - producing a green build with no installer
      # in it and no error to explain why.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          # $env:ProgramFiles(x86) does NOT parse in PowerShell - the (x86) is
          # read as literal text after $env:ProgramFiles. The braced form is
          # required. Several candidates are probed because the Chocolatey
          # package location has moved between runner images.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe",
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            Write-Host 'Searched these locations:'
            $candidates | ForEach-Object { Write-Host "  $_" }
            throw 'ISCC.exe not found after installing Inno Setup.'
          }
          Write-Host "Using $iscc"
          & $iscc packaging\friday_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

      - name: Verify the installer exists
        shell: pwsh
        run: |
          $setup = 'dist\installer\FridaySetup.exe'
          if (-not (Test-Path $setup)) {
            Write-Host 'Contents of dist:'
            Get-ChildItem dist -Recurse -Depth 2 |
              Select-Object -ExpandProperty FullName | ForEach-Object { Write-Host "  $_" }
            throw "ISCC succeeded but $setup is missing."
          }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "$setup is $mb MB"
          "Installer: **FridaySetup.exe, $mb MB**" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Download it from the **Artifacts** section at the bottom of this run." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

      # No `if: hashFiles(...)` guard here. That guard silently skipped the
      # upload when the installer was missing, which is precisely the case that
      # should have turned the build red instead.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: FridaySetup
          path: dist/installer/FridaySetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: Friday-portable
          path: dist/Friday
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/installer/FridaySetup.exe
          body: |
            ## FRIDAY ${{ github.ref_name }} for Windows

            **Install:** download `FridaySetup.exe`, run it, then paste your
            Gemini API key when Notepad opens.

            Windows SmartScreen will warn that the publisher is unknown - the
            installer is unsigned. Choose *More info* then *Run anyway*.

            Speaks English, Malayalam, Hindi, Tamil, Spanish, Italian, French,
            German, Chinese, Korean and Japanese, and follows whichever one you
            speak. See `docs/LANGUAGES.md` and `docs/WINDOWS.md`.
