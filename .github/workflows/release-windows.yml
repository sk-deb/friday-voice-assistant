name: Windows build

# Builds friday.exe and the installer on a real Windows runner.
#
# - Push a tag like v1.1.0  -> installer attached to a GitHub Release
# - Run manually            -> installer available as a downloadable artifact
#
# This exists so an installer can be produced without owning a Windows build
# machine: trigger the workflow, then download the result.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Also compile the Inno Setup installer"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          # Prebuilt VAD wheels so the runner needs no C++ toolchain.
          python -m pip install webrtcvad-wheels

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/friday.spec --noconfirm --clean

      - name: Verify the exe starts
        run: |
          .\dist\Friday\friday.exe --version
          .\dist\Friday\friday.exe --languages

      - name: Report build size
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-ChildItem dist\Friday -Recurse |
            Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "dist/Friday is $mb MB"
          "Frozen app size: **$mb MB**" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Install Inno Setup
        if: >-
          github.event_name == 'push' ||
          inputs.make_installer
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: >-
          github.event_name == 'push' ||
          inputs.make_installer
        run: >-
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          packaging\friday_installer.iss
        shell: pwsh

      - name: Upload the installer
        if: hashFiles('dist/installer/FridaySetup.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FridaySetup
          path: dist/installer/FridaySetup.exe
          if-no-files-found: error

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: Friday-portable
          path: dist/Friday
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/installer/FridaySetup.exe
          body: |
            ## FRIDAY ${{ github.ref_name }} for Windows

            **Install:** download `FridaySetup.exe`, run it, then paste your
            Gemini API key when Notepad opens.

            Windows SmartScreen will warn that the publisher is unknown - the
            installer is unsigned. Choose *More info* then *Run anyway*.

            Speaks English, Malayalam, Hindi, Tamil, Spanish, Italian, French,
            German, Chinese, Korean and Japanese, and follows whichever one you
            speak. See `docs/LANGUAGES.md` and `docs/WINDOWS.md`.
